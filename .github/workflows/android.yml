name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Permessi gradlew
        run: chmod +x gradlew

      # Nessuna chiave TMDb nella build: va inserita nell'app (Impostazioni → Configura chiave).
      - name: Compila APK di debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: streamhub-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Test unitari
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Report test (se falliscono)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Pubblica release (solo per tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
